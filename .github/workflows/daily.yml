name: Daily Contribution

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-contribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make daily update
        run: |
          export TZ=Asia/Kolkata

          git config user.name "NABORAJ SARKAR"
          git config user.email "nishant.ns.business@gmail.com"

          echo "Daily update: $(date '+%Y-%m-%d %H:%M:%S %Z')" >> log.txt

          git add log.txt
          git commit -m "chore: daily contribution" || echo "Nothing to commit"

          git pull --rebase origin main
          git push origin HEAD:main
